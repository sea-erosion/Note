<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>小説執筆ツール</title>
<style>
  :root {
    --bg: #12141A;
    --surface: #1A1D26;
    --surface2: #222633;
    --border: #2E3347;
    --border2: #3A4060;
    --fg: #C8CCDB;
    --fg2: #7C84A0;
    --fg3: #4A5070;
    --accent: #7C6AF0;
    --accent2: #5A4DC0;
    --gold: #C8A84B;
    --gold2: #8A6F28;
    --teal: #4AAFAA;
    --red: #C05A5A;
    --green: #4A9A6A;
    --font: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    --font-ui: 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== TOPBAR ===== */
  #topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 46px;
    gap: 8px;
    flex-shrink: 0;
  }

  .logo {
    font-size: 13px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-right: 12px;
    white-space: nowrap;
  }

  .tab-group {
    display: flex;
    gap: 2px;
    margin-right: auto;
  }

  .tab {
    padding: 5px 14px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.08em;
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    color: var(--fg2);
    background: transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab:hover { color: var(--fg); background: var(--surface2); }
  .tab.active { color: var(--accent); border-color: var(--accent); background: rgba(124,106,240,0.08); }

  .top-btn {
    padding: 5px 10px;
    font-size: 11px;
    font-weight: bold;
    border: 1px solid var(--border2);
    border-radius: 3px;
    cursor: pointer;
    color: var(--fg2);
    background: transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .top-btn:hover { color: var(--fg); border-color: var(--fg2); }
  .top-btn.primary { border-color: var(--accent); color: var(--accent); }
  .top-btn.primary:hover { background: var(--accent); color: white; }
  .top-btn.gold { border-color: var(--gold2); color: var(--gold); }
  .top-btn.gold:hover { background: var(--gold2); color: white; }
  .top-btn.save { border-color: var(--green); color: var(--green); }
  .top-btn.save:hover { background: var(--green); color: white; }

  /* ===== MAIN LAYOUT ===== */
  #workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
  }

  .sidebar-label {
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.12em;
    color: var(--fg3);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-label button {
    background: none;
    border: 1px solid var(--border2);
    color: var(--fg3);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 2px;
    cursor: pointer;
  }

  .sidebar-label button:hover { color: var(--accent); border-color: var(--accent); }

  .scene-item {
    padding: 5px 8px;
    font-size: 12px;
    color: var(--fg2);
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scene-item:hover { background: var(--surface2); color: var(--fg); }
  .scene-item.active { background: rgba(124,106,240,0.12); color: var(--accent); }

  .scene-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--fg3);
    flex-shrink: 0;
  }

  .scene-item.active .dot { background: var(--accent); }

  /* 進捗バー */
  .progress-wrap {
    padding: 10px 12px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--fg2);
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    background: var(--surface2);
    border-radius: 3px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--teal));
    transition: width 0.5s ease;
  }

  .progress-note {
    font-size: 10px;
    color: var(--fg3);
  }

  #sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  /* ===== PANELS ===== */
  #panel-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* --- EDITOR PANEL --- */
  #editor-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #editor-toolbar {
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .tb-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--fg2);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--font-ui);
    white-space: nowrap;
    transition: all 0.12s;
  }

  .tb-btn:hover { color: var(--fg); border-color: var(--fg2); }
  .tb-btn.active-toggle { color: var(--teal); border-color: var(--teal); }

  .tb-sep { width: 1px; background: var(--border); height: 18px; flex-shrink: 0; }

  .tb-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--fg);
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 2px;
    width: 50px;
  }

  #scene-title-bar {
    padding: 12px 35px 0;
    flex-shrink: 0;
  }

  #scene-title-input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--gold);
    font-size: 16px;
    font-family: var(--font);
    width: 100%;
    padding: 4px 0;
    outline: none;
  }

  #scene-title-input:focus { border-bottom-color: var(--gold2); }

  #editor-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
  }

  #ed {
    flex: 1;
    padding: 24px 35px;
    background: transparent;
    color: var(--fg);
    border: none;
    outline: none;
    font-size: 18px;
    line-height: 1.9;
    resize: none;
    font-family: var(--font);
    box-sizing: border-box;
  }

  .v-mode {
    writing-mode: vertical-rl;
    text-orientation: upright;
    padding: 35px 80px 35px 35px !important;
  }

  #cnt {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-size: 10px;
    color: var(--teal);
    background: rgba(26,29,38,0.9);
    padding: 2px 8px;
    border-radius: 3px;
    pointer-events: none;
  }

  #find-bar {
    background: var(--surface2);
    border-top: 1px solid var(--border);
    padding: 6px 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }

  #find-bar input {
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--fg);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 2px;
    width: 90px;
  }

  /* --- RIGHT PANEL --- */
  #right-panel {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .rp-tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .rp-tab {
    flex: 1;
    padding: 8px 4px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.06em;
    color: var(--fg3);
    cursor: pointer;
    text-align: center;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: all 0.12s;
  }

  .rp-tab:hover { color: var(--fg2); }
  .rp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .rp-panel { display: none; flex: 1; overflow-y: auto; padding: 12px; flex-direction: column; gap: 10px; }
  .rp-panel.visible { display: flex; }


  /* CHARACTER PANEL */
  .char-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }

  .char-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .char-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .char-name-input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    font-size: 13px;
    font-weight: bold;
    width: 100%;
    outline: none;
    padding: 2px 0;
  }

  .char-field {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    margin-bottom: 5px;
  }

  .char-field-label {
    font-size: 10px;
    color: var(--fg3);
    width: 36px;
    flex-shrink: 0;
    padding-top: 3px;
  }

  .char-field-input {
    background: none;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--fg2);
    font-size: 11px;
    flex: 1;
    outline: none;
    padding: 2px 0;
    font-family: var(--font-ui);
    resize: none;
    min-height: 20px;
  }

  .char-field-input:focus { border-bottom-color: var(--accent); color: var(--fg); }

  .add-char-btn {
    width: 100%;
    padding: 7px;
    background: none;
    border: 1px dashed var(--border2);
    color: var(--fg3);
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .add-char-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* SETTINGS PANEL */
  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .setting-label {
    font-size: 10px;
    color: var(--fg3);
    font-weight: bold;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .setting-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--fg);
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 3px;
    width: 100%;
    font-family: var(--font-ui);
    outline: none;
  }

  .setting-input:focus { border-color: var(--accent); }

  textarea.setting-input { resize: vertical; min-height: 60px; }

  /* GOAL PANEL */
  .goal-display {
    text-align: center;
    padding: 12px 0;
  }

  .goal-num {
    font-size: 32px;
    font-weight: bold;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  .goal-sub { font-size: 11px; color: var(--fg3); margin-top: 2px; }

  .goal-ring-wrap {
    display: flex;
    justify-content: center;
    margin: 10px 0;
  }

  .daily-log {
    font-size: 10px;
    color: var(--fg3);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .daily-log-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 3px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(124,106,240,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }

  /* Notification */
  #notif {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--fg);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 4px;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">✦ NOVEL</span>
  <div class="tab-group">
    <button class="tab active" onclick="switchView('editor')">エディタ</button>
    <button class="tab" onclick="switchView('outline')">構成</button>
  </div>
  <input type="number" id="fs" value="18" style="width:38px; background:var(--surface2); border:1px solid var(--border); color:var(--fg); padding:3px 4px; border-radius:2px; font-size:11px;" onchange="upF()">
  <button class="top-btn" onclick="ld()">LOAD</button>
  <button class="top-btn save" id="ov" style="display:none;" onclick="ovS()">OVERWRITE</button>
  <button class="top-btn primary" onclick="dl()">NEW SAVE</button>
  <button class="top-btn gold" onclick="cp()">COPY ALL</button>
  <button class="top-btn" onclick="showBackup()" style="border-color:var(--teal);color:var(--teal);" onmouseover="this.style.background='var(--teal)';this.style.color='white'" onmouseout="this.style.background='';this.style.color='var(--teal)'">BACKUP</button>
  <button class="top-btn" onclick="exportZip()" style="border-color:var(--gold2);color:var(--gold);" onmouseover="this.style.background='var(--gold2)';this.style.color='white'" onmouseout="this.style.background='';this.style.color='var(--gold)'">ZIP出力</button>
  <button class="top-btn" onclick="importZip()" style="border-color:var(--gold2);color:var(--gold);" onmouseover="this.style.background='var(--gold2)';this.style.color='white'" onmouseout="this.style.background='';this.style.color='var(--gold)'">ZIP読込</button>
</div>

<!-- MAIN WORKSPACE -->
<div id="workspace">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <!-- 進捗 -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span>総文字数</span>
        <span id="total-cnt" style="color:var(--gold);">0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="goal-bar" style="width:0%"></div>
      </div>
      <div class="progress-note" id="goal-note">目標未設定</div>
    </div>

    <!-- 章・話 -->
    <div class="sidebar-section">
      <div class="sidebar-label">
        章 / 話
        <button onclick="addChapter()">＋章追加</button>
      </div>
    </div>
    <div id="sidebar-scroll">
      <div id="scene-list"></div>
    </div>
  </div>

  <!-- PANEL AREA -->
  <div id="panel-area">

    <!-- EDITOR PANEL -->
    <div id="editor-panel">
      <div id="editor-toolbar">
        <button class="tb-btn" onclick="tgR()" id="rot-btn">縦書き</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="ud()">↩ UNDO</button>
        <button class="tb-btn" onclick="rd()">↪ REDO</button>
        <div class="tb-sep"></div>
        <input type="text" id="fi" placeholder="検索..." class="tb-input" style="width:80px;">
        <button class="tb-btn" onclick="fn()">次へ</button>
        <input type="text" id="ri" placeholder="置換..." class="tb-input" style="width:80px;">
        <button class="tb-btn" onclick="ra()">全置換</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="tw()" style="color:#1DA1F2;">X投稿</button>
      </div>

      <div id="scene-title-bar">
        <input type="text" id="scene-title-input" placeholder="シーン名..." value="" oninput="saveSceneTitle()">
      </div>

      <div id="editor-wrap">
        <textarea id="ed" placeholder="ここに執筆..." oninput="upS()"></textarea>
        <div id="cnt">0文字</div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel">
      <div class="rp-tab-bar">
        <button class="rp-tab active" onclick="switchRP('char')">人物</button>
        <button class="rp-tab" onclick="switchRP('setting')">設定</button>
        <button class="rp-tab" onclick="switchRP('goal')">目標</button>
      </div>


      <!-- CHARACTER PANEL -->
      <div class="rp-panel visible" id="rp-char">
        <div id="char-list"></div>
        <button class="add-char-btn" onclick="addChar()">＋ 登場人物を追加</button>
      </div>

      <!-- SETTING PANEL -->
      <div class="rp-panel" id="rp-setting">
        <div class="setting-row">
          <div class="setting-label">作品タイトル</div>
          <input class="setting-input" type="text" id="s-title" placeholder="タイトル未定" oninput="saveSettings()">
        </div>
        <div class="setting-row">
          <div class="setting-label">ジャンル</div>
          <input class="setting-input" type="text" id="s-genre" placeholder="例：ファンタジー、恋愛、ミステリ" oninput="saveSettings()">
        </div>
        <div class="setting-row">
          <div class="setting-label">舞台・世界観</div>
          <textarea class="setting-input" id="s-world" placeholder="時代、場所、世界の特徴など" oninput="saveSettings()"></textarea>
        </div>
        <div class="setting-row">
          <div class="setting-label">あらすじ / テーマ</div>
          <textarea class="setting-input" id="s-synopsis" placeholder="物語の概要、伝えたいテーマ" oninput="saveSettings()"></textarea>
        </div>
        <div class="setting-row">
          <div class="setting-label">メモ</div>
          <textarea class="setting-input" id="s-memo" placeholder="自由メモ（伏線、プロット案など）" style="min-height:100px;" oninput="saveSettings()"></textarea>
        </div>
      </div>

      <!-- GOAL PANEL -->
      <div class="rp-panel" id="rp-goal">
        <div class="goal-display">
          <div class="goal-num" id="g-total">0</div>
          <div class="goal-sub">総文字数</div>
        </div>
        <div class="goal-ring-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--surface2)" stroke-width="10"/>
            <circle id="g-ring" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="10"
              stroke-dasharray="314" stroke-dashoffset="314"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              style="transition: stroke-dashoffset 0.5s ease;"/>
            <text x="60" y="55" text-anchor="middle" fill="var(--fg2)" font-size="11">達成率</text>
            <text x="60" y="72" id="g-pct" text-anchor="middle" fill="var(--gold)" font-size="18" font-weight="bold">0%</text>
          </svg>
        </div>
        <div class="setting-row">
          <div class="setting-label">執筆目標 (文字数)</div>
          <input class="setting-input" type="number" id="g-target" placeholder="例：80000" oninput="saveGoal()">
        </div>
        <div class="setting-row">
          <div class="setting-label">今日の目標 (文字数)</div>
          <input class="setting-input" type="number" id="g-daily" placeholder="例：2000" oninput="saveGoal()">
        </div>
        <div>
          <div class="setting-label" style="margin-bottom:6px;">今日の進捗</div>
          <div class="daily-log" id="daily-log-display">
            <div style="color:var(--fg3); font-size:11px; text-align:center; padding: 8px 0;">記録なし</div>
          </div>
        </div>
        <button class="top-btn save" onclick="recordDaily()" style="width:100%; padding:8px; font-size:12px;">今日の文字数を記録</button>
      </div>
    </div>

  </div>
</div>

<!-- NOTIFICATION -->
<div id="notif"></div>

<!-- BACKUP MODAL -->
<div id="backup-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border2);border-radius:8px;width:460px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);">
      <span style="font-size:13px;font-weight:bold;color:var(--teal);">バックアップ管理</span>
      <button onclick="hideBackup()" style="background:none;border:none;color:var(--fg2);cursor:pointer;font-size:16px;">×</button>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;">
      <button class="top-btn save" onclick="createBackup()" style="font-size:11px;">✦ 今すぐバックアップ</button>
      <button class="top-btn primary" onclick="exportAllBackups()" style="font-size:11px;">全件エクスポート(.json)</button>
      <button class="top-btn" onclick="importBackup()" style="font-size:11px;">ファイルから復元</button>
    </div>
    <div style="padding:8px 12px;font-size:10px;color:var(--fg3);">最大20件保存（古いものから自動削除）</div>
    <div id="backup-list" style="flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;"></div>
  </div>
</div>

<script>
// ========== STATE ==========
const ed = document.getElementById('ed');
let h = [''], rS = [], fh = null, li = 0;
let curChapter = 0, curEpisode = 0;

// Data — 章(chapters) > 話(episodes) の2階層
let data = {
  chapters: [{
    id: 1,
    title: '第一章',
    episodes: [{id: 1, title: '第一話', content: ''}]
  }],
  chars: [],
  settings: {title:'', genre:'', world:'', synopsis:'', memo:''},
  goal: {target:0, daily:0},
  dailyLog: []
};

// 旧データ移行
function migrateData(d) {
  if (d.scenes && !d.chapters) {
    d.chapters = [{
      id: Date.now(),
      title: '第一章',
      episodes: d.scenes.map((s, i) => ({id: s.id||i, title: s.title||('第'+(i+1)+'話'), content: s.content||''}))
    }];
    delete d.scenes;
  }
  return d;
}

// ========== INIT ==========
window.onload = () => {
  const saved = localStorage.getItem('novel_data');
  if (saved) try { data = migrateData(JSON.parse(saved)); } catch(e) {}
  renderScenes();
  loadEpisode(0, 0);
  loadSettings();
  loadGoal();
  renderChars();
  upF();
  updateGoalDisplay();
};

function save() {
  localStorage.setItem('novel_data', JSON.stringify(data));
}

// ========== CHAPTER / EPISODE ==========

function curEp() { return data.chapters[curChapter].episodes[curEpisode]; }

function renderScenes() {
  const list = document.getElementById('scene-list');
  list.innerHTML = '';
  data.chapters.forEach((ch, ci) => {
    // 章ヘッダー
    const chDiv = document.createElement('div');
    chDiv.style.cssText = 'display:flex;align-items:center;gap:4px;padding:4px 8px 2px;';
    chDiv.innerHTML = `
      <span style="font-size:10px;color:var(--fg3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
            title="${esc(ch.title)}">${ch.title||'無題の章'}</span>
      <button onclick="editChapterTitle(${ci})" title="章名を編集" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:11px;padding:1px 3px;line-height:1;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--fg3)'">✎</button>
      <button onclick="addEpisode(${ci})" title="話を追加" style="background:none;border:1px solid var(--border2);color:var(--fg3);cursor:pointer;font-size:9px;padding:1px 4px;border-radius:2px;line-height:1.4;" onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--fg3)';this.style.borderColor='var(--border2)'">＋話</button>
      <button onclick="removeChapter(${ci})" title="章を削除" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:11px;padding:1px 3px;line-height:1;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--fg3)'">×</button>`;
    list.appendChild(chDiv);

    // 話リスト
    ch.episodes.forEach((ep, ei) => {
      const epDiv = document.createElement('div');
      const isActive = ci === curChapter && ei === curEpisode;
      epDiv.className = 'scene-item' + (isActive ? ' active' : '');
      epDiv.style.paddingLeft = '20px';
      epDiv.innerHTML = `
        <span class="dot"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(ep.title)}">${ep.title||'無題の話'}</span>
        <button onclick="editEpisodeTitle(event,${ci},${ei})" title="話名を編集" style="background:none;border:none;color:transparent;cursor:pointer;font-size:11px;padding:1px 3px;line-height:1;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='transparent'">✎</button>
        <button onclick="removeEpisode(event,${ci},${ei})" title="削除" style="background:none;border:none;color:transparent;cursor:pointer;font-size:11px;padding:1px 3px;line-height:1;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='transparent'">×</button>`;
      epDiv.onclick = (e) => { if(e.target.tagName==='BUTTON') return; saveCurrentScene(); loadEpisode(ci, ei); };
      list.appendChild(epDiv);
    });
  });
}

function loadEpisode(ci, ei) {
  curChapter = ci; curEpisode = ei;
  const ep = curEp();
  ed.value = ep.content || '';
  document.getElementById('scene-title-input').value = ep.title || '';
  h = [ed.value]; rS = [];
  upS();
  renderScenes();
}

function saveCurrentScene() {
  const ep = curEp();
  ep.content = ed.value;
  ep.title = document.getElementById('scene-title-input').value;
  save();
}

function saveSceneTitle() {
  curEp().title = document.getElementById('scene-title-input').value;
  save();
  renderScenes();
}

function addChapter() {
  saveCurrentScene();
  const ci = data.chapters.length;
  data.chapters.push({id: Date.now(), title: '第'+(ci+1)+'章', episodes:[{id:Date.now()+1, title:'第一話', content:''}]});
  save();
  loadEpisode(ci, 0);
}

function addEpisode(ci) {
  saveCurrentScene();
  const ei = data.chapters[ci].episodes.length;
  data.chapters[ci].episodes.push({id: Date.now(), title: '第'+(ei+1)+'話', content:''});
  save();
  loadEpisode(ci, ei);
}

function removeChapter(ci) {
  if (data.chapters.length <= 1) { notify('最後の章は削除できません'); return; }
  if (!confirm('「' + (data.chapters[ci].title||'この章') + '」を削除しますか？（話もすべて削除されます）')) return;
  data.chapters.splice(ci, 1);
  const nc = Math.min(curChapter, data.chapters.length - 1);
  save();
  loadEpisode(nc, 0);
}

function removeEpisode(e, ci, ei) {
  e.stopPropagation();
  if (data.chapters[ci].episodes.length <= 1) { notify('最後の話は削除できません'); return; }
  if (!confirm('「' + (data.chapters[ci].episodes[ei].title||'この話') + '」を削除しますか？')) return;
  data.chapters[ci].episodes.splice(ei, 1);
  const ne = Math.min(curEpisode, data.chapters[ci].episodes.length - 1);
  save();
  loadEpisode(ci, ne);
}

function editChapterTitle(ci) {
  const ch = data.chapters[ci];
  const name = prompt('章名を入力してください', ch.title || '');
  if (name === null) return;
  ch.title = name;
  save();
  renderScenes();
}

function editEpisodeTitle(e, ci, ei) {
  e.stopPropagation();
  const ep = data.chapters[ci].episodes[ei];
  const name = prompt('話名を入力してください', ep.title || '');
  if (name === null) return;
  ep.title = name;
  if (ci === curChapter && ei === curEpisode) {
    document.getElementById('scene-title-input').value = name;
  }
  save();
  renderScenes();
}

// ========== EDITOR ==========
function upS() {
  saveCurrentScene();
  const len = ed.value.length;
  document.getElementById('cnt').innerText = len.toLocaleString() + '文字';

  // total count
  let total = 0;
  total = data.chapters.reduce((t,ch)=>t+ch.episodes.reduce((s,ep)=>s+(ep.content||'').length,0),0);
  document.getElementById('total-cnt').innerText = total.toLocaleString();
  document.getElementById('g-total').innerText = total.toLocaleString();

  if(ed.value !== h[h.length-1]) {
    h.push(ed.value);
    if(h.length > 80) h.shift();
    rS = [];
  }
  updateGoalDisplay();
}

function upF() {
  const v = document.getElementById('fs').value;
  ed.style.fontSize = v + 'px';
}

function ud() { if(h.length>1){rS.push(h.pop()); ed.value=h[h.length-1]; upS();} }
function rd() { if(rS.length>0){const n=rS.pop(); h.push(n); ed.value=n; upS();} }

function tgR() {
  ed.classList.toggle('v-mode');
  const btn = document.getElementById('rot-btn');
  btn.classList.toggle('active-toggle');
  btn.textContent = ed.classList.contains('v-mode') ? '横書き' : '縦書き';
}

function dl() {
  saveCurrentScene();
  // Save all scenes as one file
  let text = '';
  data.chapters.forEach(ch => {
    text += '【' + (ch.title||'無題の章') + '】\n\n';
    ch.episodes.forEach(ep => {
      text += '《' + (ep.title||'無題の話') + '》\n\n' + (ep.content||'') + '\n\n';
    });
  });
  const b = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = (data.settings.title || 'novel') + '_' + Date.now() + '.txt';
  a.click();
}

async function ld() {
  try {
    [fh] = await window.showOpenFilePicker();
    const file = await fh.getFile();
    const buffer = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buffer);
    if (text.includes('\uFFFD')) text = new TextDecoder('shift-jis').decode(buffer);
    ed.value = text;
    saveCurrentScene();
    document.getElementById('ov').style.display = 'inline';
    upS();
  } catch(e) {}
}

async function ovS() {
  if (!fh) return;
  saveCurrentScene();
  let text = '';
  data.chapters.forEach(ch=>{text+='《'+(ch.title||'無題の章')+'》\n\n';ch.episodes.forEach(ep=>{text+='《'+(ep.title||'無題の話')+'》\n\n'+(ep.content||'')+'\n\n';});});
  try {
    const w = await fh.createWritable();
    await w.write(text);
    await w.close();
    notify('上書き保存しました');
  } catch(e) {}
}

function cp() {
  saveCurrentScene();
  let text = '';
  data.chapters.forEach(ch=>ch.episodes.forEach(ep=>{text+=(ep.content||'');}));
  navigator.clipboard.writeText(text).then(() => notify('コピーしました'));
}

function tw() {
  window.open('https://x.com/intent/post?text=' + encodeURIComponent(ed.value.substring(0,100)));
}

function fn() {
  const s = document.getElementById('fi').value;
  if (!s) return;
  let i = ed.value.indexOf(s, li);
  if (i === -1) i = ed.value.indexOf(s, 0);
  if (i !== -1) { ed.setSelectionRange(i, i+s.length); ed.focus(); li = i+s.length; }
}

function ra() {
  const f = document.getElementById('fi').value, r = document.getElementById('ri').value;
  if (f) { ed.value = ed.value.split(f).join(r); upS(); }
}

// ========== VIEW SWITCH ==========
function switchView(v) {
  document.querySelectorAll('#topbar .tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  // For now both views use same editor
}

function switchRP(id) {
  document.querySelectorAll('.rp-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.rp-panel').forEach(p => p.classList.remove('visible'));
  event.target.classList.add('active');
  document.getElementById('rp-' + id).classList.add('visible');
}

// ========== CHARACTERS ==========
function renderChars() {
  const list = document.getElementById('char-list');
  list.innerHTML = '';
  const colors = ['#7C6AF0','#4AAFAA','#C8A84B','#C05A5A','#4A9A6A','#8888CC'];
  data.chars.forEach((c, i) => {
    const col = colors[i % colors.length];
    const initials = (c.name || '?').slice(0,2);
    list.innerHTML += `
      <div class="char-card" style="margin-bottom:8px;">
        <div class="char-card-header">
          <div class="char-avatar" style="background:${col}22; color:${col};">${initials}</div>
          <input class="char-name-input" value="${esc(c.name)}" placeholder="名前" oninput="updateChar(${i},'name',this.value)">
          <button onclick="removeChar(${i})" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:14px;padding:2px;">×</button>
        </div>
        <div class="char-field">
          <span class="char-field-label">役割</span>
          <input class="char-field-input" value="${esc(c.role)}" placeholder="主人公、ヒロイン..." oninput="updateChar(${i},'role',this.value)">
        </div>
        <div class="char-field">
          <span class="char-field-label">年齢</span>
          <input class="char-field-input" value="${esc(c.age)}" placeholder="18歳" oninput="updateChar(${i},'age',this.value)">
        </div>
        <div class="char-field">
          <span class="char-field-label">外見</span>
          <textarea class="char-field-input" rows="2" placeholder="外見の特徴..." oninput="updateChar(${i},'look',this.value)">${esc(c.look)}</textarea>
        </div>
        <div class="char-field">
          <span class="char-field-label">性格</span>
          <textarea class="char-field-input" rows="2" placeholder="性格・特徴..." oninput="updateChar(${i},'desc',this.value)">${esc(c.desc)}</textarea>
        </div>
      </div>`;
  });
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addChar() {
  data.chars.push({name:'', role:'', age:'', look:'', desc:''});
  save();
  renderChars();
}

function removeChar(i) {
  data.chars.splice(i,1);
  save();
  renderChars();
}

function updateChar(i, key, val) {
  data.chars[i][key] = val;
  save();
}

// ========== SETTINGS ==========
function loadSettings() {
  const s = data.settings;
  document.getElementById('s-title').value = s.title || '';
  document.getElementById('s-genre').value = s.genre || '';
  document.getElementById('s-world').value = s.world || '';
  document.getElementById('s-synopsis').value = s.synopsis || '';
  document.getElementById('s-memo').value = s.memo || '';
}

function saveSettings() {
  data.settings.title = document.getElementById('s-title').value;
  data.settings.genre = document.getElementById('s-genre').value;
  data.settings.world = document.getElementById('s-world').value;
  data.settings.synopsis = document.getElementById('s-synopsis').value;
  data.settings.memo = document.getElementById('s-memo').value;
  save();
}

// ========== GOAL ==========
function loadGoal() {
  document.getElementById('g-target').value = data.goal.target || '';
  document.getElementById('g-daily').value = data.goal.daily || '';
  renderDailyLog();
}

function saveGoal() {
  data.goal.target = parseInt(document.getElementById('g-target').value) || 0;
  data.goal.daily = parseInt(document.getElementById('g-daily').value) || 0;
  save();
  updateGoalDisplay();
}

function updateGoalDisplay() {
  let total = 0;
  total = data.chapters.reduce((t,ch)=>t+ch.episodes.reduce((s,ep)=>s+(ep.content||'').length,0),0);

  const target = data.goal.target || 0;
  const pct = target > 0 ? Math.min(100, Math.round(total / target * 100)) : 0;

  // Ring
  const ring = document.getElementById('g-ring');
  ring.setAttribute('stroke-dashoffset', 314 - (314 * pct / 100));
  document.getElementById('g-pct').textContent = pct + '%';

  // Sidebar bar
  const bar = document.getElementById('goal-bar');
  bar.style.width = pct + '%';
  document.getElementById('goal-note').textContent = target > 0
    ? `目標：${target.toLocaleString()}字 （残り ${Math.max(0, target-total).toLocaleString()}字）`
    : '目標未設定';
}

function recordDaily() {
  let total = 0;
  total = data.chapters.reduce((t,ch)=>t+ch.episodes.reduce((s,ep)=>s+(ep.content||'').length,0),0);
  const today = new Date().toLocaleDateString('ja-JP');
  data.dailyLog = data.dailyLog || [];
  // Update or add today
  const idx = data.dailyLog.findIndex(r => r.date === today);
  if (idx >= 0) data.dailyLog[idx].cnt = total;
  else data.dailyLog.push({date: today, cnt: total});
  if (data.dailyLog.length > 30) data.dailyLog = data.dailyLog.slice(-30);
  save();
  renderDailyLog();
  notify('記録しました');
}

function renderDailyLog() {
  const el = document.getElementById('daily-log-display');
  if (!data.dailyLog || data.dailyLog.length === 0) {
    el.innerHTML = '<div style="color:var(--fg3);font-size:11px;text-align:center;padding:8px 0;">記録なし</div>';
    return;
  }
  const recent = [...data.dailyLog].reverse().slice(0, 7);
  el.innerHTML = recent.map(r => `
    <div class="daily-log-row">
      <span>${r.date}</span>
      <span style="color:var(--gold);">${r.cnt.toLocaleString()}字</span>
    </div>`).join('');
}

// ========== UTIL ==========
function notify(msg, dur=2000) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.style.display = 'block';
  clearTimeout(n._t);
  n._t = setTimeout(() => { n.style.display = 'none'; }, dur);
}

// ========== BACKUP ==========
const BACKUP_KEY = 'novel_backups';
const MAX_BACKUPS = 20;

function getBackups() {
  try { return JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); } catch(e) { return []; }
}

function saveBackups(bks) {
  localStorage.setItem(BACKUP_KEY, JSON.stringify(bks));
}

function createBackup(silent) {
  saveCurrentScene();
  const bks = getBackups();
  const entry = {
    id: Date.now(),
    date: new Date().toLocaleString('ja-JP'),
    title: data.settings.title || '無題',
    chapterCount: data.chapters.length,
    episodeCount: data.chapters.reduce((t,ch)=>t+ch.episodes.length, 0),
    charCount: data.chapters.reduce((t,ch)=>t+ch.episodes.reduce((s,ep)=>s+(ep.content||'').length,0),0),
    snapshot: JSON.stringify(data)
  };
  bks.unshift(entry);
  if (bks.length > MAX_BACKUPS) bks.splice(MAX_BACKUPS);
  saveBackups(bks);
  if (!silent) {
    renderBackupList();
    notify('バックアップを作成しました');
  }
}

function restoreBackup(id) {
  const bks = getBackups();
  const entry = bks.find(b => b.id === id);
  if (!entry) return;
  if (!confirm('「' + entry.date + '」のバックアップに復元しますか？\n現在の内容は上書きされます。')) return;
  try {
    data = migrateData(JSON.parse(entry.snapshot));
    save();
    renderScenes();
    loadEpisode(0, 0);
    loadSettings();
    loadGoal();
    renderChars();
    updateGoalDisplay();
    hideBackup();
    notify('復元しました');
  } catch(e) { notify('復元に失敗しました'); }
}

function deleteBackup(id) {
  if (!confirm('このバックアップを削除しますか？')) return;
  let bks = getBackups().filter(b => b.id !== id);
  saveBackups(bks);
  renderBackupList();
}

function exportAllBackups() {
  saveCurrentScene();
  const payload = { exportedAt: new Date().toISOString(), current: data, backups: getBackups() };
  const b = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = (data.settings.title || 'novel') + '_backup_' + Date.now() + '.json';
  a.click();
  notify('エクスポートしました');
}

function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const payload = JSON.parse(text);
      // Support both full export and bare data
      const imported = payload.current || payload;
      if (!imported.chapters && !imported.scenes) throw new Error('invalid');
      if (!confirm('インポートしますか？現在の内容は上書きされます。')) return;
      data = migrateData(imported);
      save();
      renderScenes();
      loadEpisode(0, 0);
      loadSettings();
      loadGoal();
      renderChars();
      updateGoalDisplay();
      hideBackup();
      notify('インポートしました');
    } catch(e) { notify('ファイルの読み込みに失敗しました'); }
  };
  inp.click();
}

function renderBackupList() {
  const list = document.getElementById('backup-list');
  const bks = getBackups();
  if (bks.length === 0) {
    list.innerHTML = '<div style="color:var(--fg3);font-size:12px;text-align:center;padding:20px 0;">バックアップがありません</div>';
    return;
  }
  list.innerHTML = bks.map(b => `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:10px 12px;display:flex;align-items:center;gap:10px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;color:var(--fg);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</div>
        <div style="font-size:10px;color:var(--fg3);margin-top:2px;">${b.date}　${b.chapterCount}章 / ${b.episodeCount}話 / ${b.charCount.toLocaleString()}字</div>
      </div>
      <button onclick="restoreBackup(${b.id})" style="background:none;border:1px solid var(--teal);color:var(--teal);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;" onmouseover="this.style.background='var(--teal)';this.style.color='white'" onmouseout="this.style.background='';this.style.color='var(--teal)'">復元</button>
      <button onclick="deleteBackup(${b.id})" style="background:none;border:none;color:var(--fg3);font-size:14px;cursor:pointer;padding:2px 4px;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--fg3)'">×</button>
    </div>`).join('');
}

function showBackup() {
  renderBackupList();
  document.getElementById('backup-modal').style.display = 'flex';
}

function hideBackup() {
  document.getElementById('backup-modal').style.display = 'none';
}

// 自動バックアップ（30分ごと）
// ========== ZIP EXPORT / IMPORT ==========
// JSZipをCDNから動的ロード
function loadJSZip() {
  return new Promise((resolve, reject) => {
    if (window.JSZip) { resolve(window.JSZip); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => resolve(window.JSZip);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function exportZip() {
  saveCurrentScene();
  let JSZip;
  try { JSZip = await loadJSZip(); }
  catch(e) { notify('JSZipの読み込みに失敗しました（オフライン？）'); return; }

  const zip = new JSZip();
  const title = data.settings.title || 'novel';

  // index.json — 全構造メタデータ
  const index = {
    exportedAt: new Date().toISOString(),
    title: data.settings.title,
    genre: data.settings.genre,
    settings: data.settings,
    chars: data.chars,
    goal: data.goal,
    structure: data.chapters.map((ch, ci) => ({
      id: ch.id,
      title: ch.title,
      folder: `ch${String(ci+1).padStart(2,'0')}_${sanitize(ch.title)}`,
      episodes: ch.episodes.map((ep, ei) => ({
        id: ep.id,
        title: ep.title,
        file: `ep${String(ei+1).padStart(2,'0')}_${sanitize(ep.title)}.txt`,
        charCount: (ep.content||'').length
      }))
    }))
  };
  zip.file('index.json', JSON.stringify(index, null, 2));

  // 各章フォルダ / 各話テキスト
  data.chapters.forEach((ch, ci) => {
    const chFolder = `ch${String(ci+1).padStart(2,'0')}_${sanitize(ch.title)}`;
    const folder = zip.folder(chFolder);

    // chapter.json — 章メタ
    folder.file('chapter.json', JSON.stringify({
      id: ch.id, title: ch.title,
      episodeCount: ch.episodes.length,
      charCount: ch.episodes.reduce((s,ep)=>s+(ep.content||'').length,0)
    }, null, 2));

    ch.episodes.forEach((ep, ei) => {
      const epFile = `ep${String(ei+1).padStart(2,'0')}_${sanitize(ep.title)}`;
      // 本文テキスト
      folder.file(epFile + '.txt', ep.content || '');
      // 話メタJSON
      folder.file(epFile + '.json', JSON.stringify({
        id: ep.id, title: ep.title,
        charCount: (ep.content||'').length
      }, null, 2));
    });
  });

  const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '_' + formatDate() + '.zip';
  a.click();
  notify('ZIPを出力しました');
}

async function importZip() {
  let JSZip;
  try { JSZip = await loadJSZip(); }
  catch(e) { notify('JSZipの読み込みに失敗しました（オフライン？）'); return; }

  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.zip';
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    try {
      const zip = await JSZip.loadAsync(file);

      // index.json を読む
      const indexFile = zip.file('index.json');
      if (!indexFile) { notify('index.jsonが見つかりません'); return; }
      const index = JSON.parse(await indexFile.async('string'));

      if (!confirm('ZIPから読み込みますか？現在の内容は上書きされます。')) return;

      // 各章・話の本文を復元
      const chapters = [];
      for (const chMeta of index.structure) {
        const episodes = [];
        for (const epMeta of chMeta.episodes) {
          const txtPath = chMeta.folder + '/' + epMeta.file;
          const txtFile = zip.file(txtPath);
          const content = txtFile ? await txtFile.async('string') : '';
          episodes.push({ id: epMeta.id, title: epMeta.title, content });
        }
        chapters.push({ id: chMeta.id, title: chMeta.title, episodes });
      }

      data = {
        chapters,
        chars: index.chars || [],
        settings: index.settings || {title:'',genre:'',world:'',synopsis:'',memo:''},
        goal: index.goal || {target:0, daily:0},
        dailyLog: data.dailyLog || []
      };
      save();
      renderScenes();
      loadEpisode(0, 0);
      loadSettings();
      loadGoal();
      renderChars();
      updateGoalDisplay();
      notify('ZIPを読み込みました');
    } catch(e) {
      console.error(e);
      notify('読み込みに失敗しました: ' + e.message);
    }
  };
  inp.click();
}

function sanitize(str) {
  return (str||'untitled').replace(/[\\/:*?"<>|\s]/g,'_').substring(0, 30);
}

function formatDate() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') +
    '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
}

setInterval(() => { createBackup(true); }, 30 * 60 * 1000);
// 閉じる前にバックアップ
window.addEventListener('beforeunload', () => { createBackup(true); });

</script>
